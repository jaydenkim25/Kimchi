<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimchi</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #020617, #082f49);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    text-align: center;
    background: rgba(0, 15, 40, 0.85);
    padding: 40px;
    border-radius: 20px;
    width: 90%;
    max-width: 600px;
    box-shadow: 0 0 35px #001f3f;
}

h1 {
    font-size: 55px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 30px;
}

input {
    width: 70%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #38bdf8;
    background: #0f172a;
    color: white;
    font-size: 16px;
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    background: #0284c7;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #38bdf8;
    color: black;
}
</style>
</head>

<body>

<div class="box">
    <h1>Kimchi</h1>

    <input id="searchBox" placeholder="Search the web...">

    <br>

    <button onclick="search()">Search</button>
</div>

<script>
async function search() {
    let query = document.getElementById("searchBox").value.trim();

    if (query === "") {
        return;
    }

    try {
        let response = await fetch(
            "https://kimchi-api-8cob.onrender.com/search?q=" + encodeURIComponent(query)
        );

        let data = await response.json();

        document.title = "Kimchi - " + query;

        alert("NEW VERSION LOADED");

    } catch (error) {
        alert("API connection failed");
        console.log(error);
    }
}

document.getElementById("searchBox").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        search();
    }
});
</script>

</body>
</html>
