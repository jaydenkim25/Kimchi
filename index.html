<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimchi</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #020617, #082f49);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    text-align: center;
    background: rgba(0, 15, 40, 0.85);
    padding: 40px;
    border-radius: 20px;
    width: 90%;
    max-width: 600px;
    box-shadow: 0 0 35px #001f3f;
}

h1 {
    font-size: 55px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 30px;
}

input {
    width: 70%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #38bdf8;
    background: #0f172a;
    color: white;
    font-size: 16px;
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    margin-left: 5px;
    margin-right: 5px;
    border: none;
    border-radius: 10px;
    background: #0284c7;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #38bdf8;
    color: black;
}

#results {
    margin-top: 30px;
    padding: 20px;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 15px;
    text-align: left;
}

#results h2 {
    color: #38bdf8;
}
</style>

</head>

<body>

<div class="box">

<h1>Kimchi</h1>

<input id="searchBox" placeholder="Search the web...">

<br>

<button onclick="search()">Search</button>

<button onclick="clearSearch()">Clear</button>


<div id="results"></div>

</div>


<script>

async function search() {

    let query = document.getElementById("searchBox").value.trim();

    if (query === "") {
        return;
    }

    try {

        let response = await fetch(
            "https://kimchi-api-8cob.onrender.com/search?q=" + encodeURIComponent(query)
        );

        let data = await response.json();


        document.getElementById("results").innerHTML = `

            <h2>AI Overview</h2>

            <p>
                You searched for:
                <b>${data.search}</b>
            </p>

            <p>
                Kimchi is preparing results for this search.
            </p>

        `;


    } catch (error) {

        document.getElementById("results").innerHTML = `

            <h2>Error</h2>

            <p>API connection failed.</p>

        `;

        console.log(error);

    }

}


function clearSearch() {

    document.getElementById("searchBox").value = "";

    document.getElementById("results").innerHTML = "";

}


document.getElementById("searchBox").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        search();

    }

});

</script>

</body>
</html>
